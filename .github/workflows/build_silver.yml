name: Build silver

# Rebuilds silver from bronze and runs the data quality checks. Daily after the ingest
# workflows (and on demand); a failing error-level check fails this workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

concurrency:
  group: build-silver
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      - name: Build silver + quality checks
        run: python -m f1_forecast.ops.run_job f1_forecast_silver_build --timeout-min 50
