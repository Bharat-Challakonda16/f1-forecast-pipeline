# Rebuilds silver from bronze, runs the silver quality checks (fails loudly), rebuilds the
# gold feature tables, runs the gold checks (keys, ranges and known-F1-fact checks), then
# refreshes the review notebook.
resources:
  jobs:
    silver_build:
      name: f1_forecast_silver_build
      max_concurrent_runs: 1
      tasks:
        - task_key: build_silver
          notebook_task:
            notebook_path: ../notebooks/20_silver_build.py
            base_parameters:
              catalog: ${var.catalog}
              sql_dir: ${workspace.file_path}/databricks/sql/silver

        - task_key: quality_checks
          depends_on:
            - task_key: build_silver
          notebook_task:
            notebook_path: ../notebooks/21_silver_quality.py
            base_parameters:
              catalog: ${var.catalog}
              checks_file: ${workspace.file_path}/databricks/sql/quality/silver_checks.sql

        - task_key: build_gold
          depends_on:
            - task_key: quality_checks
          notebook_task:
            notebook_path: ../notebooks/20_silver_build.py
            base_parameters:
              catalog: ${var.catalog}
              sql_dir: ${workspace.file_path}/databricks/sql/gold

        - task_key: gold_checks
          depends_on:
            - task_key: build_gold
          notebook_task:
            notebook_path: ../notebooks/21_silver_quality.py
            base_parameters:
              catalog: ${var.catalog}
              checks_file: ${workspace.file_path}/databricks/sql/quality/gold_checks.sql

        - task_key: gold_sanity_review
          depends_on:
            - task_key: gold_checks
          notebook_task:
            notebook_path: ../notebooks/30_gold_sanity.py
            base_parameters:
              catalog: ${var.catalog}
