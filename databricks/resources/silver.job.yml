# Rebuilds the silver layer from bronze, then runs the data quality checks (fails loudly).
resources:
  jobs:
    silver_build:
      name: f1_forecast_silver_build
      max_concurrent_runs: 1
      tasks:
        - task_key: build_silver
          notebook_task:
            notebook_path: ../notebooks/20_silver_build.py
            base_parameters:
              catalog: ${var.catalog}
              sql_dir: ${workspace.file_path}/databricks/sql/silver

        - task_key: quality_checks
          depends_on:
            - task_key: build_silver
          notebook_task:
            notebook_path: ../notebooks/21_silver_quality.py
            base_parameters:
              catalog: ${var.catalog}
              checks_file: ${workspace.file_path}/databricks/sql/quality/silver_checks.sql
