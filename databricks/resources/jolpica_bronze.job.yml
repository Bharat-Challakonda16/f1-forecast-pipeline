# Loads landed Jolpica files and the manual seeds into bronze. Triggered by the GitHub
# ingest workflow after upload.
resources:
  jobs:
    jolpica_bronze:
      name: f1_forecast_jolpica_bronze
      max_concurrent_runs: 1
      tasks:
        - task_key: setup_catalog
          notebook_task:
            notebook_path: ../notebooks/00_setup_catalog.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: bronze_jolpica
          depends_on:
            - task_key: setup_catalog
          notebook_task:
            notebook_path: ../notebooks/10_bronze_jolpica.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: bronze_seeds
          depends_on:
            - task_key: setup_catalog
          notebook_task:
            notebook_path: ../notebooks/12_bronze_seeds.py
            base_parameters:
              catalog: ${var.catalog}
              configs_dir: ${workspace.file_path}/configs
