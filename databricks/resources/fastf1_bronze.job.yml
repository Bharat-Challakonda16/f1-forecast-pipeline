# Loads newly landed FastF1 files (2018-2022 backfill) into bronze (Auto Loader).
# Triggered by the GitHub ingest workflow when new sessions landed.
resources:
  jobs:
    fastf1_bronze:
      name: f1_forecast_fastf1_bronze
      max_concurrent_runs: 1
      tasks:
        - task_key: setup_catalog
          notebook_task:
            notebook_path: ../notebooks/00_setup_catalog.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: bronze_fastf1
          depends_on:
            - task_key: setup_catalog
          notebook_task:
            notebook_path: ../notebooks/11_bronze_autoloader.py
            base_parameters:
              catalog: ${var.catalog}
              source: fastf1
              tables: >-
                laps,results,car_data,position,weather,race_control,track_status,
                session_status,circuit_corners
