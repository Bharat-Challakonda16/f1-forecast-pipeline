# Loads newly landed OpenF1 files into bronze (Auto Loader). Triggered by the GitHub
# ingest workflow when new sessions landed.
resources:
  jobs:
    openf1_bronze:
      name: f1_forecast_openf1_bronze
      max_concurrent_runs: 1
      tasks:
        - task_key: setup_catalog
          notebook_task:
            notebook_path: ../notebooks/00_setup_catalog.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: bronze_openf1
          depends_on:
            - task_key: setup_catalog
          notebook_task:
            notebook_path: ../notebooks/11_bronze_openf1.py
            base_parameters:
              catalog: ${var.catalog}
